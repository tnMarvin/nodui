# 功能：GitHub Actions 定期排程抓取警政署開放資料並更新 Repo 內的 CSV 線索與統計檔
# 產生日期與時間：2026-11-18 08:42

name: Update NPA Data

on:
  schedule:
    # 每週一台灣時間早上 08:00 (UTC 00:00) 自動執行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 支援在 GitHub Actions 網頁手動點擊測試

permissions:
  contents: write

jobs:
  fetch-npa-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出專案原始碼 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 執行警政署開放資料抓取與整理腳本
        run: python3 scripts/fetch_npa.py

      - name: 4. 檢查變更並自動 Commit 回儲存庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add official_stats.csv npa_candidates.csv || true
          git diff --staged --quiet || (git commit -m "chore(data): 自動更新警政署統計與待查證車禍線索" && git push)
